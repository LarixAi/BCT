name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  secrets-audit:
    name: Secrets audit (F-04)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked files for committed secrets
        run: npm run audit:secrets

      - name: Secret scanner unit tests
        run: node scripts/audit-secrets.unit.mjs

  yard:
    name: Yard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: F-03 Gate 0 scanner
        run: npm run test:f03-gate0

      - name: Build
        run: npm run build

      - name: Production build guard (Blueprint F-03)
        run: VERIFY_SKIP_BUILD=1 npm run verify:production-build

  admin:
    name: Admin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Folder name includes a trailing space. Actions trims defaults.run.working-directory,
    # so every step cd's explicitly instead.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ format('{0} /package-lock.json', 'Veyvio admin') }}

      - name: Install
        run: |
          cd "Veyvio admin "
          npm ci

      - name: Lint
        run: |
          cd "Veyvio admin "
          npm run lint

      - name: Unit tests
        run: |
          cd "Veyvio admin "
          npm test

      - name: F-03 production fallback inventory
        run: |
          cd "Veyvio admin "
          npm run test:f03-fallback-inventory

      - name: Typecheck
        run: |
          cd "Veyvio admin "
          npm run typecheck

      - name: Build
        env:
          CI: "true"
          VITE_API_URL: /api/command
        run: |
          cd "Veyvio admin "
          npm run build

  admin-fresh-db:
    name: Admin fresh-DB gate (FIX-P1-048)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ format('{0} /package-lock.json', 'Veyvio admin') }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install Admin deps
        run: |
          cd "Veyvio admin "
          npm ci

      - name: Fresh-DB gate (reset, inventory, JWT + structural proofs)
        run: |
          cd "Veyvio admin "
          npm run test:fresh-db-gate

  driver:
    name: Driver
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: veyvio-driver-App
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: veyvio-driver-App/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key
          VITE_COMMAND_API_BASE_URL: https://example.supabase.co/functions/v1/command-api
          VITE_AUTH_API_BASE_URL: https://example.supabase.co/functions/v1/command-api
          VITE_DRIVER_APP_URL: https://localhost
          VITE_DRIVER_NAV_TEST_MODE: "true"
        run: npm run build

  driver-production-guards:
    name: Driver production guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: veyvio-driver-App
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: veyvio-driver-App/package-lock.json

      - name: Install
        run: npm ci

      - name: Gate 1 automated exit tests
        run: npm run test:gate1-exit

      - name: Production build scan (no mock/Base44/PHV)
        run: npm run verify:production-build

  driver-android:
    name: Driver Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: veyvio-driver-App
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: veyvio-driver-App/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: npm ci

      - name: Build web + sync Capacitor
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key
          VITE_COMMAND_API_BASE_URL: https://example.supabase.co/functions/v1/command-api
          VITE_AUTH_API_BASE_URL: https://example.supabase.co/functions/v1/command-api
          VITE_DRIVER_APP_URL: https://driver.example.com
        run: npm run build:android

      - name: Assemble debug APK
        run: npm run android:apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: veyvio-driver-debug-apk
          path: veyvio-driver-App/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  tenant-isolation:
    name: Tenant isolation + dispatch gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Requires repo secrets against hosted Command API (see docs/plan/veyvio-multi-tenant-saas-roadmap.md).
    # Fork PRs genuinely cannot access repo secrets (GitHub Actions restriction)
    # and skip below. Every other trigger — push to main, same-repo PRs,
    # workflow_dispatch — must have these secrets configured; missing them
    # there is a CI misconfiguration and must FAIL, not silently pass.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ format('{0} /package-lock.json', 'Veyvio admin') }}

      - name: Install Admin deps
        run: |
          cd "Veyvio admin "
          npm ci

      - name: Cross-tenant isolation + F-06 dispatch gates
        env:
          CI: "true"
          VEYVIO_ANON_KEY: ${{ secrets.VEYVIO_ANON_KEY }}
          VEYVIO_API_URL: ${{ secrets.VEYVIO_API_URL }}
          VEYVIO_SUPABASE_URL: ${{ secrets.VEYVIO_SUPABASE_URL }}
          VEYVIO_PLATFORM_EMAIL: ${{ secrets.VEYVIO_PLATFORM_EMAIL }}
          VEYVIO_PLATFORM_PASSWORD: ${{ secrets.VEYVIO_PLATFORM_PASSWORD }}
          VEYVIO_ISOLATION_PASSWORD: ${{ secrets.VEYVIO_ISOLATION_PASSWORD }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          cd "Veyvio admin "
          if [ -z "${VEYVIO_ANON_KEY}" ]; then
            if [ "${IS_FORK_PR}" = "true" ]; then
              echo "::warning::VEYVIO_ANON_KEY is not set — fork PRs cannot access repo secrets, skipping tenant isolation smoke."
              exit 0
            fi
            echo "::error::VEYVIO_ANON_KEY is not set on a trusted trigger (push to main / same-repo PR / workflow_dispatch) — tenant isolation smoke MUST run here. Configure repo secrets before merging."
            exit 1
          fi
          npm run test:tenant-isolation
          npm run test:dispatch-gates-live

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: veyvio-website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: veyvio-website/package-lock.json

      - name: Install
        run: npm ci

      - name: Claims publish check
        run: npm run verify:claims

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_SITE_URL: https://veyvio.co.uk
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility smoke
        run: npm run test:a11y

  cost-control:
    name: Cost Control
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: veyvio-cost-control
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: veyvio-cost-control/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (production modes required)
        env:
          VITE_AUTH_MODE: command
          VITE_FINANCE_DATA_MODE: api
          VITE_API_URL: https://example.supabase.co/functions/v1/command-api
          VITE_SUPABASE_ANON_KEY: ci-anon-key
          VITE_FINANCE_API_URL: https://example.supabase.co/functions/v1/finance-api
        run: npm run build

  executive:
    name: Executive
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: veyvio-executive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: npm
          cache-dependency-path: veyvio-executive/package-lock.json

      - name: Install
        run: npm ci

      - name: Secret source scan
        run: npm run security:scan:source

      - name: Dependency audit
        run: npm run security:audit

      - name: Build then security tests (artifact HTML assertions)
        run: npm test

  gate1-preflight:
    name: Gate 1 preflight (F-17)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Yard deps
        run: npm ci

      - name: Install Driver deps
        run: |
          cd veyvio-driver-App
          npm ci

      - name: Install Admin deps
        run: |
          cd "Veyvio admin "
          npm ci

      - name: Build Yard (production guard scan)
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key
          VITE_COMMAND_API_BASE_URL: https://example.supabase.co/functions/v1/command-api
        run: npm run build

      - name: Build Driver (production guard scan)
        working-directory: veyvio-driver-App
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key
          VITE_COMMAND_API_BASE_URL: https://example.supabase.co/functions/v1/command-api
          VITE_AUTH_API_BASE_URL: https://example.supabase.co/functions/v1/command-api
          VITE_DRIVER_APP_URL: https://driver.example.com
        run: npm run build

      - name: Gate 1 static preflight
        run: GATE1_SKIP_BUILD=1 npm run gate1:preflight -- --skip-build
