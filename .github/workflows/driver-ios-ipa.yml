# Gate 3 / PROD-6 — iOS IPA release chain (fail-closed).
# Manual: Actions → Driver iOS IPA → Run workflow
# Requires Apple signing secrets in GitHub Environment `production`.
# Without secrets the job fails closed (does not produce a demo IPA).

name: Driver iOS IPA

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Semantic version (ignored when the ref is a driver-v* tag)
        required: false
        type: string
  push:
    tags:
      - "driver-v*"

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  archive-release:
    name: archive IPA
    runs-on: macos-14
    timeout-minutes: 60
    environment: production
    concurrency:
      group: veyvio-driver-ios-production
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: veyvio-driver-App
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      VITE_COMMAND_API_BASE_URL: ${{ vars.VITE_COMMAND_API_BASE_URL }}
      VITE_AUTH_API_BASE_URL: ${{ vars.VITE_AUTH_API_BASE_URL }}
      VITE_DRIVER_APP_URL: ${{ vars.VITE_DRIVER_APP_URL }}
      VITE_ENABLE_PUSH: "false"
      VITE_MOCK_API: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Require production configuration
        run: |
          set -eu
          : "${VITE_SUPABASE_URL:?missing VITE_SUPABASE_URL (GitHub Environment production var)}"
          : "${VITE_SUPABASE_ANON_KEY:?missing VITE_SUPABASE_PUBLISHABLE_KEY or VITE_SUPABASE_ANON_KEY}"
          : "${VITE_COMMAND_API_BASE_URL:?missing VITE_COMMAND_API_BASE_URL}"
          : "${VITE_AUTH_API_BASE_URL:?missing VITE_AUTH_API_BASE_URL}"
          case "$VITE_SUPABASE_URL" in
            https://example.supabase.co*|http://localhost*|https://localhost*)
              echo "::error::Production IPA must not use a demo/local Supabase URL"
              exit 1
              ;;
          esac
          host="${VITE_SUPABASE_URL#https://}"
          host="${host#http://}"
          host="${host%%/*}"
          echo "EXPECTED_SUPABASE_HOST=$host" >> "$GITHUB_ENV"

      - name: Assert iOS release scaffolding
        run: node scripts/assert-ios-release-ready.mjs

      - name: Require Apple signing secrets
        env:
          VEYVIO_APPLE_TEAM_ID: ${{ secrets.VEYVIO_APPLE_TEAM_ID }}
          VEYVIO_APPLE_CERTIFICATE_BASE64: ${{ secrets.VEYVIO_APPLE_CERTIFICATE_BASE64 }}
          VEYVIO_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.VEYVIO_APPLE_CERTIFICATE_PASSWORD }}
          VEYVIO_APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.VEYVIO_APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=0
          for name in VEYVIO_APPLE_TEAM_ID VEYVIO_APPLE_CERTIFICATE_BASE64 VEYVIO_APPLE_CERTIFICATE_PASSWORD VEYVIO_APPLE_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name — add Apple distribution secrets before IPA builds (see docs/plan/gate3-testflight-archive.md)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: veyvio-driver-App/package-lock.json

      - name: Install
        run: npm ci

      - name: Build release web artifact
        run: npm run build

      - name: Production scan of the exact web artifact
        run: npm run verify:production-build
        env:
          VERIFY_SKIP_BUILD: "1"

      - name: Assert production endpoint identity
        run: |
          node scripts/assert-release-config.mjs \
            --dist dist \
            --expected-supabase-host "$EXPECTED_SUPABASE_HOST"

      - name: Capacitor sync iOS
        run: npx cap sync ios

      - name: Record provenance (pre-archive)
        run: |
          node scripts/record-release-provenance.mjs \
            --platform ios \
            --sha "${GITHUB_SHA}" \
            --version-name "${{ github.event.inputs.version_name || github.ref_name }}" \
            --supabase-host "$EXPECTED_SUPABASE_HOST" \
            --out "$RUNNER_TEMP/driver-ios-release-provenance.json"
          cat "$RUNNER_TEMP/driver-ios-release-provenance.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload provenance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: veyvio-driver-ios-provenance
          path: ${{ runner.temp }}/driver-ios-release-provenance.json

      - name: Import Apple signing material into keychain
        env:
          VEYVIO_APPLE_TEAM_ID: ${{ secrets.VEYVIO_APPLE_TEAM_ID }}
          VEYVIO_APPLE_CERTIFICATE_BASE64: ${{ secrets.VEYVIO_APPLE_CERTIFICATE_BASE64 }}
          VEYVIO_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.VEYVIO_APPLE_CERTIFICATE_PASSWORD }}
          VEYVIO_APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.VEYVIO_APPLE_PROVISIONING_PROFILE_BASE64 }}
          VEYVIO_APPLE_PROVISIONING_PROFILE_NAME: ${{ secrets.VEYVIO_APPLE_PROVISIONING_PROFILE_NAME }}
        run: bash scripts/ios-keychain-import.sh

      - name: Assert ExportOptions rewritten (strict)
        run: node scripts/assert-ios-release-ready.mjs --strict

      - name: Archive and export IPA
        run: |
          set -euo pipefail
          mkdir -p build/ipa
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.VEYVIO_APPLE_TEAM_ID }}"
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/App.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$PWD/build/ipa"
          ipa=$(ls build/ipa/*.ipa | head -n 1)
          echo "ipa_path=$ipa"
          shasum -a 256 "$ipa"
          node scripts/record-release-provenance.mjs \
            --platform ios \
            --sha "${GITHUB_SHA}" \
            --version-name "${{ github.event.inputs.version_name || github.ref_name }}" \
            --artifact "$ipa" \
            --supabase-host "$EXPECTED_SUPABASE_HOST" \
            --out "$RUNNER_TEMP/driver-ios-release-provenance.json"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: veyvio-driver-release-ipa
          path: veyvio-driver-App/build/ipa/*.ipa
          if-no-files-found: error
