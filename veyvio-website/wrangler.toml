name = "veyvio-website"
main = "worker/index.ts"
compatibility_date = "2024-08-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Non-secret defaults — override per environment in Cloudflare dashboard
[vars]
CRM_PROVIDER = "hubspot"
EMAIL_PROVIDER = "resend"
SALES_EMAIL = "info@veyvio.co.uk"

# Secrets (set via `wrangler secret put`):
# HUBSPOT_ACCESS_TOKEN
# RESEND_API_KEY
# DEMO_FROM_EMAIL
# DEMO_NOTIFY_EMAIL
# CALENDAR_BOOKING_URL

# Waiting-list / demo enquiry persistence (F-03 TD-025). Create once:
#   wrangler kv namespace create DEMO_LEADS
# then set id below (and staging id under [env.staging]).
# [[kv_namespaces]]
# binding = "DEMO_LEADS"
# id = "<kv_namespace_id>"

[observability]
enabled = true

[env.staging]
name = "veyvio-website-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
CRM_PROVIDER = "hubspot"
EMAIL_PROVIDER = "resend"
SALES_EMAIL = "info@veyvio.co.uk"
