<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme colour (matches light operational shell) -->
    <meta name="theme-color" content="#F9F9F9" />
    <meta name="background-color" content="#F9F9F9" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Veyvio Driver" />

    <!-- SEO / share -->
    <meta name="description" content="Veyvio Driver — PSV vehicle checks, jobs, and compliance." />
    <meta name="application-name" content="Veyvio Driver" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/veyvio-favicon.svg" />

    <title>Veyvio Driver</title>
  </head>
  <body style="margin: 0; background-color: #F9F9F9; color: #0f172a;">
    <div id="root">
      <p id="veyvio-boot-loading" style="margin:0;padding:24px;font-family:system-ui,sans-serif;font-size:15px;color:#667085;text-align:center">
        Loading Veyvio Driver…
      </p>
    </div>
    <script>
      (function () {
        function showBootError(message) {
          var el = document.getElementById("veyvio-boot-error");
          if (!el) {
            el = document.createElement("pre");
            el.id = "veyvio-boot-error";
            el.style.cssText =
              "position:fixed;inset:0;z-index:99999;margin:0;padding:16px;background:#fff;color:#b42318;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap;overflow:auto";
            document.body.appendChild(el);
          }
          el.textContent = "Veyvio Driver failed to start:\n\n" + message;
        }
        window.addEventListener("error", function (event) {
          showBootError(event.message || String(event.error || "Unknown error"));
        });
        window.addEventListener("unhandledrejection", function (event) {
          showBootError(String(event.reason || "Unhandled promise rejection"));
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
