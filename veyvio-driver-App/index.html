<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme colour (matches light operational shell) -->
    <meta name="theme-color" content="#F9F9F9" />
    <meta name="background-color" content="#F9F9F9" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Veyvio Driver" />

    <!-- SEO / share -->
    <meta name="description" content="Veyvio Driver — PSV vehicle checks, jobs, and compliance." />
    <meta name="application-name" content="Veyvio Driver" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/veyvio-favicon.svg" />

    <title>Veyvio Driver</title>
  </head>
  <body style="margin: 0; background-color: #F9F9F9; color: #0f172a;">
    <div id="root">
      <p id="veyvio-boot-loading" style="margin:0;padding:24px;font-family:system-ui,sans-serif;font-size:15px;color:#667085;text-align:center">
        Loading Veyvio Driver…
      </p>
    </div>
    <script>
      (function () {
        function isStillBooting() {
          return Boolean(document.getElementById("veyvio-boot-loading"));
        }

        function isExpectedNetworkFailure(value) {
          var message = String(value && value.message ? value.message : value || "").toLowerCase();
          return (
            message.includes("failed to fetch") ||
            message.includes("networkerror") ||
            message.includes("network request failed") ||
            message.includes("load failed")
          );
        }

        function showBootError() {
          if (!isStillBooting()) return;

          var root = document.getElementById("root");
          if (!root) return;

          var shell = document.createElement("main");
          shell.setAttribute("role", "alert");
          shell.style.cssText =
            "min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;background:#f9f9f9;color:#111827;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";

          var brand = document.createElement("p");
          brand.textContent = "Veyvio Driver";
          brand.style.cssText = "margin:0 0 20px;font-size:16px;font-weight:700";

          var title = document.createElement("h1");
          title.textContent = "Driver couldn't start";
          title.style.cssText = "margin:0;font-size:24px;line-height:1.2";

          var copy = document.createElement("p");
          copy.textContent = "Please try again. If you're offline, saved work will remain on this device.";
          copy.style.cssText = "margin:12px 0 0;max-width:420px;color:#667085;font-size:15px;line-height:1.5";

          var button = document.createElement("button");
          button.type = "button";
          button.textContent = "Try again";
          button.style.cssText =
            "margin-top:24px;min-height:48px;border:0;border-radius:12px;background:#0b0f17;color:#fff;font-size:15px;font-weight:700;padding:0 18px;cursor:pointer";
          button.addEventListener("click", function () {
            window.location.reload();
          });

          shell.appendChild(brand);
          shell.appendChild(title);
          shell.appendChild(copy);
          shell.appendChild(button);
          root.replaceChildren(shell);
        }

        window.addEventListener("error", function (event) {
          console.error("[driver-boot] runtime error", event.error || event.message);
          showBootError();
        });

        window.addEventListener("unhandledrejection", function (event) {
          console.error("[driver-boot] unhandled rejection", event.reason);
          if (isExpectedNetworkFailure(event.reason)) return;
          showBootError();
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
